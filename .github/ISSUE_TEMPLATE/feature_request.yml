name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 先说清痛点，再说方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它方案
    validations:
      required: false
